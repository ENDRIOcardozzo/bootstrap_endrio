
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projeto 02 - Grid responsivo</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        .zoom-foto {
            overflow: hidden;
        }

        .zoom-foto img {
            transition: transform 0.4s ease;
        }

        .zoom-foto:hover img {
            transform: scale(1.1);
        }
    </style>

</head>

<body>

    <div class="container mt-1">

        <h2 class="text-center mb-4">Galeria Responsiva</h2>

        <div class="row g-4">

            <!-- FOTO 1 -->
            <div class="col-12 col-md-6 col-lg-4">

                <div class="zoom-foto">
                    <img src="https://via.placeholder.com/400x250/0d6efd/ffffff?text=Foto+1"
                        alt="Foto 1" class="img-fluid w-100">
                </div>

                <div class="card-body">
                    <h5>Item 1</h5>
                    <p>Redimensione a janela do navegador para ver as colunas se reorganizando.</p>
                </div>

            </div>

            <!-- FOTO 2 -->
            <div class="col-12 col-md-6 col-lg-4">

                <div class="zoom-foto">
                    <img src="https://via.placeholder.com/400x250/198754/ffffff?text=Foto+2"
                        alt="Foto 2" class="img-fluid w-100">
                </div>

                <div class="card-body">
                    <h5>Item 2</h5>
                    <p>A classe h100 garante que todos os cards tenham a mesma altura.</p>
                </div>

            </div>

            <!-- FOTO 3 -->
            <div class="col-12 col-md-6 col-lg-4">

                <div class="zoom-foto">
                    <img src="https://via.placeholder.com/400x250/dc3545/ffffff?text=Foto+3"
                        alt="Foto 3" class="img-fluid w-100">
                </div>

                <div class="card-body">
                    <h5>Item 3</h5>
                    <p>O sistema de 12 colunas facilita o alinhamento perfeito.</p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
